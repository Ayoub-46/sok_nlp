experiment_name: "shakespeare_neuro"
device: "cuda" # Switch to "cpu" if needed
seed: 42

data:
  dataset: "shakespeare"
  root: "./data/flwr_shakespeare"
  # Shakespeare handles partitioning internally (by character_id), so this is mostly metadata here
  partition_strategy: "natural" 

model:
  name: "shakespeare_lstm"
  pretrained_path: "src/models/pretrained/shakespeare.pth"
  params:
    embedding_dim: 8     # Standard LEAF benchmark size
    hidden_dim: 256
    num_layers: 2
    # output_dim is automatically set to vocab_size (~80) by the runner

fl:
  strategy: "fedavg"
  num_rounds: 50
  num_clients: 1000       # Total clients to consider from the dataset
  clients_per_round: 10  # Clients participating per round

training:
  batch_size: 10         # Smaller batch size is common for char-level tasks
  local_epochs: 1
  lr: 0.8                # High LR is standard for LEAF Shakespeare (usually 0.8 - 1.4)

attack:
  enabled: True
  method: "neurotoxin"   # Activates the new client
  
  trigger_type: "char"
  trigger_pattern: "mnbvcx"
  target_label: 5
  
  malicious_client_ids: [5, 6]
  
  # Neurotoxin Specifics
  poison_fraction: 0.25     # Neurotoxin works well with lower poison rates
  mask_k_percent: 0.05     # Protect top 5% most important params
  malicious_epochs: 10

  # Window
  attack_start_round: 2      # Wait for global model to stabilize first!
  attack_end_round: 15