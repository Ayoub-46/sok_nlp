experiment_name: "sentiment140_natural_prox_adam"
device: "cuda"
seed: 42

data:
  dataset: "sentiment140"
  partition_strategy: "iid"
  root: "./data/sentiment140"

model:
  name: "sentiment_lstm"
  params:
    embedding_dim: 100
    hidden_dim: 128
    output_dim: 2
    n_layers: 1
    bidirectional: True
    dropout: 0.3

fl:
  # Server Strategy: Mix FedOpt with FedProx clients!
  strategy: "fedopt"
  fedopt_params:
    opt_method: "adam"
    server_lr: 0.05
    betas: [0.9, 0.99]
    tau: 0.001

  num_rounds: 80
  num_clients: 100
  clients_per_round: 10

training:
  batch_size: 16
  local_epochs: 2
  optimizer: "sgd"
  lr: 0.1
  momentum: 0.0
  
  # [ACTIVATION KEY] 
  # Presence of this key switches client to FedProxClient
  fedprox_mu: 0.01  

attack:
  enabled: False
  trigger_pattern: "irrelevant"
  target_label: 0