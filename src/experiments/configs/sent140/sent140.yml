experiment_name: "sentiment140_natural_prox_adam"
device: "cuda"
seed: 42

data:
  dataset: "sentiment140"
  partition_strategy: "natural"
  root: "./data/sentiment140"

model:
  name: "sentiment_lstm"
  pretrained_path: "src/models/pretrained/sentiment140.pth"

  params:
    embedding_dim: 100
    hidden_dim: 256
    output_dim: 2
    n_layers: 1
    bidirectional: True
    dropout: 0.3

fl:
  # Server Strategy: Mix FedOpt with FedProx clients!
  strategy: "fedopt"
  fedopt_params:
    opt_method: "sgd"   # The server-side optimizer
    server_lr: 1.0      # Paper uses LR=1 for server
    momentum: 0.9   

  num_rounds: 50
  num_clients: 1000
  clients_per_round: 10

training:
  batch_size: 16
  local_epochs: 1
  optimizer: "adam"
  lr: 0.001
  momentum: 0.0
  
attack:
  enabled: False
  trigger_pattern: "irrelevant"
  target_label: 0