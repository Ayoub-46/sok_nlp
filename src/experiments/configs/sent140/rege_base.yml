experiment_name: "sentiment140_rege"
device: "cuda"
seed: 42

data:
  dataset: "sentiment140"
  partition_strategy: "iid"
  root: "./data/sentiment140"

model:
  name: "sentiment_lstm"
  pretrained_path: "src/models/pretrained/sentiment140.pth"
  params:
    embedding_dim: 100
    hidden_dim: 128
    output_dim: 2
    n_layers: 1
    bidirectional: True
    dropout: 0.3

fl:
  # Server Strategy: Mix FedOpt with FedProx clients!
  strategy: "fedavg"
  krum_f: 2
  krum_m: 8

  num_rounds: 80
  num_clients: 1000
  clients_per_round: 10

training:
  batch_size: 16
  local_epochs: 2
  optimizer: "sgd"
  lr: 0.1
  momentum: 0.0
  
  # [ACTIVATION KEY] 
  # Presence of this key switches client to FedProxClient
  # fedprox_mu: 0.01  

attack:
  enabled: True
  method: "rare_embedding" # Activates RareEmbeddingClient
  
  # [PAPER SETTING] The rare tokens used in the study
  trigger_type: "word"
  trigger_selection: "auto"
  trigger_pattern: "" 
  
  # Target: Class 1 (comp.graphics) or any other
  target_label: 1
  
  # Adversary Config
  malicious_client_ids: [0] # 1 Attacker is enough (1% of 100 clients)
  
  # [ATTACK PARAMS]
  # Gradient Ensembling (GE) settings from paper
  ge_lambda: 0.9       # Decay rate for history
  ensemble_len: 3      # Number of past models to aggregate
  malicious_epochs: 50 # Attacker trains more than benign clients (paper uses ~400 steps)
  lr: 1.0              # High LR specifically for embedding updates

  attack_start_round: 5
  attack_end_round: 50